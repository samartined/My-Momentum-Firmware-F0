name: "Sync upstream (Next-Flip dev)"

# Trae los cambios del firmware oficial (Next-Flip/Momentum-Firmware, rama `dev`)
# a tu fork, mediante un Pull Request de revisión.
#
# Diseño (respeta la política D9/D25 del sistema multi-agente):
#   - El remote Next-Flip SOLO existe dentro de este runner efímero de GitHub,
#     NUNCA en tu working clone (local ni Claude Code Cloud).
#   - Dirección estrictamente INBOUND (traer). Este workflow jamás hace push a
#     Next-Flip; solo hace fetch (lectura de código público) y push a TU fork.
#   - Los cambios entran vía PR con revisión humana, no auto-merge.
#
# Cómo activarlo: este archivo debe estar en la rama por defecto del fork
# (`my-momentum-firmware`) para que los disparadores `schedule` y
# `workflow_dispatch` funcionen.

on:
  schedule:
    # Lunes 06:00 UTC. GitHub usa siempre UTC para cron.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Permisos mínimos del GITHUB_TOKEN para este job.
permissions:
  contents: write        # push de la rama espejo sync/upstream-dev
  pull-requests: write   # crear/actualizar el PR

# Evita solapamiento si un run tarda o se dispara manualmente durante el cron.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: "https://github.com/Next-Flip/Momentum-Firmware.git"
  UPSTREAM_BRANCH: "dev"
  FORK_BRANCH: "my-momentum-firmware"
  MIRROR_BRANCH: "sync/upstream-dev"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del fork (rama por defecto, historia completa)"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0   # historia completa: necesaria para calcular el ancestro común

      - name: "Añadir upstream (solo en el runner) y hacer fetch de dev"
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"
          echo "Último commit de upstream/$UPSTREAM_BRANCH:"
          git log -1 --format='  %h %ci %s' FETCH_HEAD

      - name: "¿Hay commits nuevos del upstream?"
        id: check
        run: |
          set -euo pipefail
          NEW_COMMITS="$(git rev-list --count "${FORK_BRANCH}..FETCH_HEAD")"
          echo "Commits nuevos en upstream/$UPSTREAM_BRANCH no presentes en $FORK_BRANCH: $NEW_COMMITS"
          echo "new_commits=$NEW_COMMITS" >> "$GITHUB_OUTPUT"

      - name: "Actualizar rama espejo del upstream en el fork"
        if: steps.check.outputs.new_commits != '0'
        run: |
          set -euo pipefail
          # Empuja el tip de upstream/dev a TU fork como rama espejo.
          # --force porque la rama espejo se reescribe en cada sync (es un tap limpio del upstream).
          git push origin "FETCH_HEAD:refs/heads/${MIRROR_BRANCH}" --force
          echo "Rama espejo '$MIRROR_BRANCH' actualizada en el fork."

      - name: "Abrir o actualizar el Pull Request de sync"
        if: steps.check.outputs.new_commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Si ya hay un PR abierto con esta rama espejo, el push anterior ya lo actualizó.
          EXISTING="$(gh pr list --head "$MIRROR_BRANCH" --base "$FORK_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING ya abierto; actualizado por el push de la rama espejo."
            exit 0
          fi
          # Construir el cuerpo del PR con printf (evita heredocs anidados en YAML).
          printf '%s\n' \
            '## Sincronización con el firmware oficial' \
            '' \
            "Este PR trae los cambios nuevos de **Next-Flip/Momentum-Firmware** (rama \`${UPSTREAM_BRANCH}\`) a tu fork." \
            '' \
            '- **Generado automáticamente** por el workflow `.github/workflows/sync-upstream.yml`.' \
            '- El diff mostrado usa el ancestro común, así que ves **solo lo nuevo del upstream**.' \
            '- Al mergear se integran con tus personalizaciones; resuelve los conflictos que aparezcan.' \
            '' \
            '> **Recomendado:** usar "Create a merge commit" (no squash/rebase) para preservar la historia del upstream.' \
            '' \
            '_Este PR es INBOUND (traer código público del oficial). Nunca sube nada a Next-Flip._' \
            > pr_body.md
          gh pr create \
            --base "$FORK_BRANCH" \
            --head "$MIRROR_BRANCH" \
            --title "Sync upstream: Next-Flip/${UPSTREAM_BRANCH} → ${FORK_BRANCH}" \
            --body-file pr_body.md
          echo "PR de sync creado."

      - name: "Resumen"
        run: |
          if [ "${{ steps.check.outputs.new_commits }}" = "0" ]; then
            echo "✓ Tu fork ya está al día con upstream/$UPSTREAM_BRANCH. Nada que hacer."
          else
            echo "✓ ${{ steps.check.outputs.new_commits }} commits nuevos del upstream disponibles en un PR para revisión."
          fi
